name: inkademy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: inkademy
      POSTGRES_PASSWORD: inkademy
      POSTGRES_DB: inkademy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inkademy"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # MinIO restringió sus imágenes en Docker Hub (minio/minio, minio/mc) a
    # requerir login — verificado en vivo: "pull access denied" en un pull
    # anónimo real, no una suposición. quay.io/minio/* es su mirror oficial
    # sin ese requisito.
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: inkademy
      MINIO_ROOT_PASSWORD: inkademy123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Crea el bucket por defecto al iniciar (equivalente local a crear el bucket S3 en prod).
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 inkademy inkademy123; do sleep 1; done;
      mc mb -p local/inkademy-assets || true;
      mc anonymous set download local/inkademy-assets || true;
      exit 0;
      "

  # mailhog/mailhog no publica imagen linux/arm64 — en Mac Apple Silicon
  # Docker Desktop la corre emulada (QEMU) y eso produce conexiones SMTP que
  # abren el socket pero nunca entregan el saludo "220" a nodemailer
  # ("Greeting never received"), aunque el contenedor esté sano. mailpit es
  # multi-arch nativo, habla el mismo protocolo SMTP y trae una UI web
  # equivalente — reemplazo sin cambiar nada del código de la app.
  mailhog:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # UI web

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://inkademy:inkademy@postgres:5432/inkademy?schema=public
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      S3_ENDPOINT: http://minio:9000
      # Sin fijar, el proceso corre en UTC (default de la imagen node:20-alpine)
      # — afecta cron/horarios de sweeps del worker y, más visible, hace que
      # el texto de fecha/hora que arma apps/web en el servidor (SSR) no
      # coincida con el que arma el navegador del usuario (su huso local),
      # disparando errores de hidratación de React en cada carga. Inkademy
      # es para Perú/LatAm — se fija America/Lima como huso real del negocio.
      TZ: America/Lima
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://inkademy:inkademy@postgres:5432/inkademy?schema=public
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      S3_ENDPOINT: http://minio:9000
      TZ: America/Lima
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # NEXT_PUBLIC_* se hornea en el bundle del navegador en tiempo de
      # BUILD, no de ejecución — ver el comentario en apps/web/Dockerfile.
      # Compose sustituye estas ${VAR} leyendo el .env de este mismo
      # directorio (no el env_file: de abajo, que solo aplica en runtime).
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_CULQI_PUBLIC_KEY: ${NEXT_PUBLIC_CULQI_PUBLIC_KEY:-}
        NEXT_PUBLIC_STRIPE_PUBLIC_KEY: ${NEXT_PUBLIC_STRIPE_PUBLIC_KEY:-}
        NEXT_PUBLIC_PAYPAL_CLIENT_ID: ${NEXT_PUBLIC_PAYPAL_CLIENT_ID:-}
    restart: unless-stopped
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      # Ver el comentario largo en el servicio "api" de este mismo archivo.
      TZ: America/Lima
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  miniodata:
